name: Notifica Discord

# GitHub Pages qui usa il builder integrato, che non e' un nostro workflow e
# quindi non puo' ospitare lo step di notifica. I workflow generati da GitHub
# non emettono workflow_run agganciabili: l'evento giusto e' page_build, che
# scatta a build del sito conclusa.
on:
  page_build

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notifica Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_STATUS: ${{ github.event.build.status }}
          SITE_URL: https://simonsruggi.github.io/app-policies/
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.event.build.pusher.login }}
          HEAD_SHA: ${{ github.event.build.commit }}
          BUILD_ERROR: ${{ github.event.build.error.message }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && { echo "DISCORD_WEBHOOK non configurato, skip"; exit 0; }
          if [ "$BUILD_STATUS" = "built" ]; then
            EMOJI="✅"; COLOR=5210250; STATUS="success"
          else
            EMOJI="❌"; COLOR=15548997; STATUS="${BUILD_STATUS:-failure}"
          fi
          SHA=$(echo "$HEAD_SHA" | cut -c1-7)
          MSG=$(git log -1 --pretty=%s "$HEAD_SHA" 2>/dev/null | head -c 180)
          [ -n "$BUILD_ERROR" ] && MSG="$MSG — $BUILD_ERROR"
          PAYLOAD=$(jq -n \
            --arg title "$EMOJI Deploy $STATUS — $REPO_NAME" \
            --arg url "$SITE_URL" \
            --arg desc "🌐 $SITE_URL
          🔀 \`$SHA\` $MSG
          👤 $ACTOR · [logs]($RUN_URL)" \
            --argjson color "$COLOR" \
            '{embeds:[{title:$title,url:$url,description:$desc,color:$color,timestamp:(now|todate)}]}')
          HTTP=$(curl -sS -o /tmp/discord_resp -w "%{http_code}" -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "User-Agent: gh-actions-deploy-notify/1.0" \
            -d "$PAYLOAD")
          echo "Discord HTTP $HTTP"; cat /tmp/discord_resp
          [ "$HTTP" = "204" ] || echo "::warning::Notifica Discord fallita (HTTP $HTTP)"
